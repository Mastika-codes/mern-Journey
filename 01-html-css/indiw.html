<!DOCTYPE html>
<html>
    <head>
        <title>
            youtube course
        </title>
        <style>
          .Na{
                background-color: red;
                color: white;
                border: none;
                height: 30px;
                width: 100px;
                border-radius: 2px;
                margin-right: 8px;
                transition: opacity 0.15s ;
           }
           .Na:hover{
            opacity: 0.1;
           }
           .Na:active{
            opacity: 0.3;

           }
            .yebo{
                background-color: white;
                color: aqua;
                border-color: aqua;
                height: 30px;
                width: 60px;
                border-style: solid;
                cursor: pointer;
                transition: opacity 0.15s;
                transition: background-color 2s, color 2s;
            }
            .me{
                background-color: aqua;
                color: white;
                border: none;
                height: 30px;
                width: 60px;
                border-radius: 20px;
                font-weight: bold;
                margin-left: 8px;
                transition: box-shadow 2s;
               
            }
            .me:hover{
                 box-shadow: 10px 10px 12px rgba(0, 0, 0, 1);
            }
            .yebo:hover{
                background-color: aqua;
                color: white;
            }
            .yebo:active{
                opacity: 0.7;
                color: white;
            }
            .mi{
                color: rgb(0, 118, 0);
            }
            .mee{
               background-color:hsl(50, 100%, 54%);
               border-radius: 20px;
               color: black;
               width: 160px;

            }
            .Naa{
                background-color: rgb(255, 164, 28);
                border-radius: 20px;
                margin-left: 8px;
                color: black;
                width: 160px;
            }
        </style>
    </head>
    <body>
        <a href="amazon.com" target="-blank">Back to Amazon</a> 
        <h1>
            Nike Black Running 
            Shoes
        </h1>
        <p class="mi">
            $39 - in stock 
        </p>
        <p class="ma">
            Free delivery tomorrow.
        </p>
        <button class="mee">Add to cart</button>
        <button class="Naa">Buy now</button>
        <br><br>
        <button class="Na">SUBSCRIBE</button>
        <button class="yebo">JOIN

        </button>
        <button class="me">Tweet</button>
    </body>
</html>
